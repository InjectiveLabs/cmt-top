# cmt-top — sample configuration
#
# Default search path: $XDG_CONFIG_HOME/cmt-top/config.toml
# (or ~/.config/cmt-top/config.toml). Use --config /path/to/file.toml
# to point at a specific file.
#
# Generate a config matching the running defaults:
#   ./bin/cmt-top --print-config > ~/.config/cmt-top/config.toml
#
# All sections are optional; missing keys fall back to baked-in defaults.

[chain]
name           = "" # optional display label; actual network comes from RPC
bech32_prefix  = "inj"
lcd            = "https://lcd.injective.network"
explorer_url   = "https://explorer.injective.network/validator/{address}"

# Cross-RPC AppHash comparison. Checks run at the status interval.
# Compare headers at the same height; lag and unavailable nodes remain distinct
# from a verified mismatch.
# monitored_rpcs = [
#   "https://injective-rpc.publicnode.com:443",
#   "https://rpc.injective.posthuman.digital",
# ]


# Multi-RPC: list as many as you want; first entry wins until it errors and
# the circuit breaker fails over to the next. The WS client uses the same
# endpoint list; their active endpoints and health are reported separately.
[[chain.rpc]]
url     = "https://tm.injective.network"
primary = true

[[chain.rpc]]
url = "https://injective-rpc.publicnode.com:443"


[refresh]
validators   = "30s"   # validator-set + moniker enrichment
upgrade_plan = "5m"    # x/upgrade plan (rare)
status       = "5s"    # /status — height, sync, our-validator
block_time   = "30s"   # rolling avg block time
consensus    = "1s"    # HTTP fallback poll cadence; used when the vote stream is unavailable

[divergence]
threshold_pct    = 5.0       # any alternate non-nil group ≥ this VP% is a split
history_size     = 32        # last N divergent rounds retained for the history view
include_prevotes = false     # also detect prevote-stage splits (noisy)

[ui]
mode = "web"   # tui | web | both | headless

[ui.tui]
timezone       = "UTC"
disable_emojis = false

[ui.web]
listen      = "127.0.0.1:8080"
# token       = "set-me-when-binding-non-loopback (otherwise a warning is logged)"
# cors_origin = "https://my-dash.example.com"
disabled    = false

[obs]
metrics_listen = "127.0.0.1:9091"
log_level      = "info"   # debug | info | warn | error
log_format     = "text"   # text | json
