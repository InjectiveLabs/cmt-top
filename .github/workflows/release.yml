name: Release Docker image

on:
  push:
    tags: ["v**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ECR_REPO: public.ecr.aws/l9h3g6c6/cmt-top
  AWS_REGION: us-east-1

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  docker:
    name: Publish linux/amd64 image
    needs: checks
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release configuration and tags
        id: release
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [[ -z "$AWS_ROLE_ARN" ]]; then
            echo "::error::Set the AWS_ROLE_ARN repository variable to the cmt-top ECR publishing role."
            exit 1
          fi
          if (( ${#GITHUB_REF_NAME} > 128 )) || [[ "$GITHUB_REF_TYPE" != tag ]] || [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Release from a version tag, such as v1.2.3 or v1.2.3-rc.1."
            exit 1
          fi
          {
            echo 'tags<<EOF'
            echo "${ECR_REPO}:${GITHUB_REF_NAME}"
            if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "${ECR_REPO}:latest"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Set up cached Docker builder
        uses: useblacksmith/setup-docker-builder@6ff44f8e5255f9d8aa31ef22f7e57a2d926b7da0 # v1.11.0

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
        with:
          registry-type: public

      - name: Build and push
        uses: useblacksmith/build-push-action@fb9e3e6a9299c78462bfadd0d93352c316adc9b8 # v2.2.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.release.outputs.tags }}
          build-args: |
            VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.title=cmt-top
            org.opencontainers.image.description=Live dashboard for CometBFT-based Cosmos chains
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT
